apiVersion: batch/v1
kind: Job
metadata:
  name: pollen-sam-job
  namespace: stenc-ns
spec:
  backoffLimit: 1
  template:
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: pollen-sam
        image: ultralytics/ultralytics:latest
        workingDir: /tmp
        command:
          - /bin/bash
          - -c
          - |
            pip install --user boto3 Pillow python-dotenv --quiet

            # Download FastSAM-s.pt from S3 if not already present
            if [ ! -f /tmp/FastSAM-s.pt ]; then
              echo "⬇️  Downloading FastSAM-s.pt from S3..."
              python3 -c "
            import boto3, os
            from botocore.client import Config
            s3 = boto3.client('s3',
                endpoint_url=os.environ['S3_ENDPOINT'],
                aws_access_key_id=os.environ['AWS_ACCESS_KEY_ID'],
                aws_secret_access_key=os.environ['AWS_SECRET_ACCESS_KEY'],
                config=Config(signature_version='s3v4'))
            s3.download_file(os.environ['S3_BUCKET'],
                os.environ.get('S3_MODEL_KEY', 'Ostatni/Pollen_viability/trained_models/FastSAM-s.pt'),
                '/tmp/FastSAM-s.pt')
            print('✅ Model downloaded.')
            "
            fi

            cp /scripts/run_sam_s3.py /tmp/run_sam_s3.py
            python /tmp/run_sam_s3.py --all-folders
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        envFrom:
        - secretRef:
            name: s3-creds
        env:
          - name: S3_ENDPOINT
            value: "https://s3.cl4.du.cesnet.cz"
          - name: S3_BUCKET
            value: "bucket"
          - name: TILE_PREFIX
            value: "Ostatni/Pollen_viability/tiles_640/"
          - name: S3_MODEL_KEY
            value: "Ostatni/Pollen_viability/trained_models/FastSAM-s.pt"
          - name: MODEL_PATH
            value: "/tmp/FastSAM-s.pt"
          - name: CONF
            value: "0.30"
          - name: IOU
            value: "0.50"
          - name: MIN_AREA
            value: "400"
          - name: MAX_DIM
            value: "150"
          - name: BATCH_SIZE
            value: "32"
          - name: FETCH_WORKERS
            value: "16"
        resources:
          requests:
            memory: "16Gi"
            cpu: "4"
            nvidia.com/gpu: "1"
          limits:
            memory: "32Gi"
            cpu: "8"
            nvidia.com/gpu: "1"
        volumeMounts:
        - name: script-volume
          mountPath: /scripts
      volumes:
      - name: script-volume
        configMap:
          name: sam-script
      restartPolicy: Never
