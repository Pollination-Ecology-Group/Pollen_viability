apiVersion: batch/v1
kind: Job
metadata:
  name: pollen-detect-job
  namespace: stenc-ns
spec:
  backoffLimit: 1
  template:
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: pollen-detector
        image: ultralytics/ultralytics:latest
        workingDir: /tmp
        command:
          - /bin/bash
          - -c
          - |
            pip install --user boto3 Pillow --quiet
            cp /scripts/run_detections_s3.py /tmp/run_detections_s3.py
            python /tmp/run_detections_s3.py
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        envFrom:
        - secretRef:
            name: s3-creds
        env:
          - name: S3_ENDPOINT
            value: "https://s3.cl4.du.cesnet.cz"
          - name: S3_BUCKET
            value: "bucket"
          - name: TILE_PREFIX
            value: "Ostatni/Pollen_viability/tiles_640/"
          - name: S3_MODEL_KEY
            value: "Ostatni/Pollen_viability/trained_models/pollen_train_20260313_2153/weights/best.pt"
          - name: MODEL_PATH
            value: "/tmp/best.pt"
          - name: BATCH_SIZE
            value: "32"
          - name: FETCH_WORKERS
            value: "16"
          - name: CONF
            value: "0.25"
          - name: IOU
            value: "0.70"
          - name: MAX_DIM
            value: "130"
          - name: FORCE_REDETECT
            value: "0"
        resources:
          requests:
            memory: "16Gi"
            cpu: "4"
            nvidia.com/gpu: "1"
          limits:
            memory: "32Gi"
            cpu: "8"
            nvidia.com/gpu: "1"
        volumeMounts:
        - name: script-volume
          mountPath: /scripts
      volumes:
      - name: script-volume
        configMap:
          name: detect-script
      restartPolicy: Never
