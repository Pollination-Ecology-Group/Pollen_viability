apiVersion: batch/v1
kind: Job
metadata:
  name: pollen-inference-test-job
  namespace: stenc-ns
spec:
  backoffLimit: 1
  template:
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: pollen-inference-test
        image: ultralytics/ultralytics:latest
        workingDir: /tmp
        command:
          - /bin/bash
          - -c
          - |
            pip install --user boto3 Pillow python-dotenv --quiet

            # Copy script from ConfigMap
            cp /scripts/run_inference_test.py /tmp/run_inference_test.py

            # Run the single-image inference test
            python /tmp/run_inference_test.py
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        envFrom:
        - secretRef:
            name: s3-creds
        env:
          - name: S3_ENDPOINT
            value: "https://s3.cl4.du.cesnet.cz"
          - name: S3_BUCKET
            value: "bucket"
          - name: S3_MODEL_KEY
            value: "Ostatni/Pollen_viability/trained_models/pollen_train_20260923_1457/weights/best.pt"
          - name: MODEL_PATH
            value: "/tmp/best.pt"
          - name: TILE_PREFIX
            value: "Ostatni/Pollen_viability/tiles_640/"
          # To test a specific tile, uncomment and set TEST_TILE_KEY:
          # - name: TEST_TILE_KEY
          #   value: "Ostatni/Pollen_viability/tiles_640/some/folder/tile.jpg"
          - name: CONF
            value: "0.25"
          - name: IOU
            value: "0.70"
          - name: MAX_DIM
            value: "130"
        resources:
          requests:
            memory: "4Gi"
            cpu: "2"
            nvidia.com/gpu: "1"
          limits:
            memory: "8Gi"
            cpu: "4"
            nvidia.com/gpu: "1"
        volumeMounts:
        - name: script-volume
          mountPath: /scripts
      volumes:
      - name: script-volume
        configMap:
          name: inference-test-script
      restartPolicy: Never
